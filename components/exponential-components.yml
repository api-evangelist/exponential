name: YO Kit (React)
description: >-
  Client-side React integration surface for embedding YO vault flows into a
  dApp. Ships a YoKitProvider context plus a large library of wagmi/TanStack
  Query hooks for reading vault state and building deposit/redeem/approve
  transactions. Distinct from the server-side SDK — this is the embeddable
  front-end layer.
