aid: exponential
name: Exponential
description: >-
  Exponential.fi is a DeFi company (backed by Paradigm and Norwest Venture
  Partners) behind YO Protocol — a cross-chain "Yield Optimizer" that
  automatically allocates deposits across the best-performing liquidity pools
  on multiple blockchains to deliver the highest risk-adjusted yield, using
  Exponential.fi's own Risk Ratings to balance risk and reward. yoVaults are
  ERC-4626 tokenized vaults (yoUSD, yoETH, yoBTC, yoEUR, yoGOLD, yoSOL and
  more) with ERC-7540-style async redemption, all routed through the single
  yoGateway entry point. The developer surface spans a public read API
  (api.yo.xyz), a first-party TypeScript SDK/React kit/CLI (@yo-protocol/*),
  official agent skills and a Base MCP plugin, and the YO Risk Graph — a paid,
  agent-facing DeFi risk-intelligence API monetized per-call via the x402 USDC
  micropayment standard on Base.
