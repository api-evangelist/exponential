notes: >-
  Standards conformance for the YO Protocol. yoVaults are built on the ERC-4626
  tokenized-vault standard with ERC-7540-style async redemption; the Risk Graph
  Agent API conforms to the x402 v2 payment standard settling via EIP-3009 over
  USDC on Base. The protocol is not a REST-standards adopter (no OAuth2/OIDC,
  no RFC 9457 problem+json). Third-party smart-contract audits are recorded
  under security_audits as evidence of the protocol's security posture (not a
  compliance certification such as SOC 2 / ISO 27001).
